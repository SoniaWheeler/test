        * {

        .header p {

            font-size: 17px;

        /* LEARNING INTENTION */

        .learning-intention {
            background-color: #ecfeff;

        }

        .learning-intention h2 {
            margin-top: 0;
            color: #155e75;
            font-size: 20px;
        }

        /* MAIN LAYOUT */

        .lesson-container {
            display: flex;
            gap: 18px;
            align-items: stretch;
        }

        /* LEFT NAVIGATION */

        .navigation {
            width: 30%;
            background-color: #172554;
            border-radius: 12px;
            padding: 18px;
            color: white;
        }

        .navigation h2 {
            color: white;
            margin-top: 0;
            font-size: 21px;
        }

        .nav-intro {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .nav-button {
            width: 100%;
            border: none;
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 9px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .nav-button:hover {
            background-color: #164e63;
        }

        .nav-button.active {
            background-color: #22d3ee;
            color: #083344;
            font-weight: bold;
        }

        .nav-number {
            display: inline-block;
            background-color: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            text-align: center;
            line-height: 28px;
            margin-right: 8px;
        }

        .nav-button.active .nav-number {
            background-color: #ffffff;
        }

        /* RIGHT CONTENT */

        .content {
            width: 70%;
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            border: 2px solid #bae6fd;
        }

        .stage {
            display: none;
        }

        .stage.active {
            display: block;
        }

        .stage-title {
            background-color: #0f766e;
            color: white;
            padding: 15px 18px;
            border-radius: 9px;
            margin-bottom: 20px;
        }

        .stage-title h2 {
            color: white;
            margin: 0;
        }

        .stage-title p {
            margin: 5px 0 0;
            color: #ccfbf1;
        }

        /* THEORY */

        .theory {
            background-color: #f0f9ff;
            border-radius: 9px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #38bdf8;
        }

        .theory h3 {
            color: #172554;
            margin-top: 0;
        }

        /* KEY IDEAS */

        .key-idea {
            background-color: #fff7ed;
            border: 2px solid #fdba74;
            border-radius: 8px;
            padding: 15px;
            margin: 18px 0;
        }

        .key-idea strong {
            color: #c2410c;
        }

        /* ACTIVITY */

        .activity {
            background-color: #fff7ed;
            border: 2px solid #f97316;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .activity h3 {
            color: #c2410c;
            margin-top: 0;
        }

            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            text-align: center;
            line-height: 32px;
            margin-right: 8px;
        }
