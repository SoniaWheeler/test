<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lesson 3 – Designing Data Solutions</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #172554;
            margin-bottom: 5px;
        }

        h2 {
            color: #172554;
        }

        h3 {
            color: #172554;
        }

        .intro {
            background-color: #e0f2fe;
            border: 2px solid #bae6fd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section {
            background-color: white;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            padding: 20px;

        }

        .question {

            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
            border: 1px solid #cbd5e1;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin-top: 5px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .radio-option {
            display: block;
            font-weight: normal;
            background-color: white;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
        }

        .radio-option:hover {
            background-color: #f1f5f9;
        }

        .radio-option input {
            margin-right: 8px;
        }

        .scenario {

            border: 2px solid #c4b5fd;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
