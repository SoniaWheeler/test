<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 3 Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            padding: 30px;
            color: #172554;
        }

        .box {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border: 2px solid #bae6fd;
            border-radius: 12px;
            padding: 30px;
        }

        h1 {
            color: #172554;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #172554;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>📊 Lesson 3 – Designing Data Solutions</h1>

        <p>
            If you can see this page, GitHub Pages is working correctly.
        </p>

        <label for="studentName">
            Your name:
        </label>

        <input
            type="text"
            id="studentName"
            placeholder="Enter your name"
        >

        <label for="answer">
            What is a requirement of a data solution?
        </label>

        <textarea
            id="answer"
            rows="5"
            placeholder="Type your answer here..."
        ></textarea>

        <button type="button">
            Test Button
        </button>

    </div>

</body>
</html>
