<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Sheet Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding: 30px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #bae6fd;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Google Sheet Test</h1>

    <label for="studentName">
        Your name
    </label>

    <input
        type="text"
        id="studentName"
        placeholder="Enter your name"
    >

    <label for="answer">
        Test answer
    </label>

    <input
        type="text"
        id="answer"
        placeholder="Type something"
    >

    <button onclick="submitTest()">
        Submit Test
    </button>

    <div id="message"></div>

</div>


<script>

const scriptURL =
"https://script.google.com/a/macros/education.nsw.gov.au/s/AKfycbyIw-TlQYb4mK_sOcKRp9QNkTLGrW6ukg0OzXe3XpKOhmlrA8CFaSSo1To2ocpuisuC/exec";


async function submitTest() {

    const studentName =
        document.getElementById("studentName").value;

    const answer =
        document.getElementById("answer").value;

    const message =
        document.getElementById("message");


    const data = {

        studentName: studentName,

        answer: answer

    };


    message.innerHTML = "Submitting...";


    try {

        await fetch(scriptURL, {

            method: "POST",

            mode: "no-cors",

            headers: {
                "Content-Type": "text/plain"
            },

            body: JSON.stringify(data)

        });


        message.innerHTML =
            "✅ Submitted. Check the Google Sheet.";

    }

    catch (error) {

        console.error(error);

        message.innerHTML =
            "❌ There was a problem submitting.";

    }

}

</script>

</body>

</html>
